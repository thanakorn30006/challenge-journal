function seedData() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  let s = 7; const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const trades = []; let id = 1;
  for (let d = 1; d < now.getDate(); d++) {
    const wd = new Date(y, m, d).getDay(); if (wd === 0 || wd === 6) continue;
    const n = 2 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) {
      const win = rnd() < 0.44, dir = rnd() < 0.5 ? 1 : -1, lots = 0.1, slDist = 3;
      const entry = r2(4000 + Math.round(rnd() * 400) / 10);
      const mv = win ? slDist * (1.2 + rnd() * 1.0) : -slDist * (0.9 + rnd() * 0.1);
      const exit = r2(entry + dir * mv);
      const followed = rnd() < 0.85;
      trades.push({
        id: id++, date: y + "-" + pad(m + 1) + "-" + pad(d), time: pad(14 + Math.floor(rnd() * 6)) + ":" + pad(Math.floor(rnd() * 60)),
        dir, lots, entry, sl: r2(entry - dir * slDist), exit, pnl: r2((exit - entry) * dir * lots * 100), followed,
        tag: win ? (followed ? "Setup" : "FOMO") : (followed ? (rnd() < 0.5 ? "Setup" : "News") : (rnd() < 0.5 ? "Revenge" : "No setup")), note: "",
      });
    }
  }
  return { settings: defaultSettings, trades, notes: {}, floating: 0, sample: true, chat: [] };
}

}
const riskOf = (t, cs) => (t.sl != null && t.entry != null && t.lots) ? Math.abs(t.entry - t.sl) * t.lots * (cs || 100) : 0;
const rOf = (t, cs) => { const r = riskOf(t, cs); return r > 0 ? t.pnl / r : null; };

function computeStats(trades, S) {
  const sorted = [...trades].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) || a.id - b.id);
  const total = sorted.reduce((a, t) => a + t.pnl, 0);
  const wins = sorted.filter((t) => t.pnl > 0), losses = sorted.filter((t) => t.pnl < 0);
  const gw = wins.reduce((a, t) => a + t.pnl, 0), gl = Math.abs(losses.reduce((a, t) => a + t.pnl, 0));
  const dm = {};
  sorted.forEach((t) => { const o = (dm[t.date] = dm[t.date] || { pnl: 0, n: 0, w: 0, trades: [] }); o.pnl += t.pnl; o.n++; if (t.pnl > 0) o.w++; o.trades.push(t); });
  const days = Object.keys(dm).sort();
  let peak = S.initial, bal = S.initial, maxDD = 0, streak = 0, maxStreak = 0;
  sorted.forEach((t) => { bal += t.pnl; peak = Math.max(peak, bal); maxDD = Math.max(maxDD, peak - bal); if (t.pnl < 0) { streak++; maxStreak = Math.max(maxStreak, streak); } else streak = 0; });
  const rs = sorted.map((t) => rOf(t, S.contract)).filter((x) => x != null);
  const byWd = [0, 0, 0, 0, 0], byWdN = [0, 0, 0, 0, 0];
  days.forEach((d) => { const w = wdIndex(new Date(d + "T00:00:00")); if (w < 5) { byWd[w] += dm[d].pnl; byWdN[w] += dm[d].n; } });
  const byHour = {}; sorted.forEach((t) => { const h = (t.time || "00:00").slice(0, 2); const o = (byHour[h] = byHour[h] || { pnl: 0, n: 0 }); o.pnl += t.pnl; o.n++; });
  const byTag = {}; sorted.forEach((t) => { const k = t.tag || "Untagged"; const o = (byTag[k] = byTag[k] || { pnl: 0, n: 0, w: 0 }); o.pnl += t.pnl; o.n++; if (t.pnl > 0) o.w++; });
  const fol = sorted.filter((t) => t.followed), unf = sorted.filter((t) => !t.followed);

  return {
    sorted, total, n: sorted.length, wins: wins.length, losses: losses.length, winRate: sorted.length ? wins.length / sorted.length : 0,
    avgWin: wins.length ? gw / wins.length : 0, avgLoss: losses.length ? gl / losses.length : 0, pf: gl > 0 ? gw / gl : gw > 0 ? Infinity : 0,
    expectancy: sorted.length ? total / sorted.length : 0, avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null,
    days, dm, tradingDays: days.length, maxDD, maxStreak, byWd, byWdN, byHour, byTag,
    folN: fol.length, folPnl: fol.reduce((a, t) => a + t.pnl, 0), unfN: unf.length, unfPnl: unf.reduce((a, t) => a + t.pnl, 0),
    best: dv.length ? dv.reduce((a, b) => (b.pnl > a.pnl ? b : a)) : null, worst: dv.length ? dv.reduce((a, b) => (b.pnl < a.pnl ? b : a)) : null,
  };
}

function todayInfo(stats, S, floating, todayStr) {
  const B = S.initial, o = stats.dm[todayStr];
  const tt = o ? o.trades.slice().sort((a, b) => a.time.localeCompare(b.time) || a.id - b.id) : [];
  const pnl = o ? o.pnl : 0;
  const dlLimit = B * S.dlPct / 100, ownLimit = B * S.ownPct / 100, mlLimit = B * S.mlPct / 100, goalDay = B * S.dailyTargetPct / 100;
  const ownRoom = ownLimit + pnl + floating, dlRoom = dlLimit + pnl + floating, mlRoom = mlLimit + stats.total + floating;
  let streak = 0; for (let i = tt.length - 1; i >= 0; i--) { if (tt[i].pnl < 0) streak++; else break; }
  const off = tt.filter((t) => !t.followed).length;
  const usedOwn = ownLimit > 0 ? (1 - ownRoom / ownLimit) : 1;
  const alerts = [];
  if (mlRoom <= 0) alerts.push({ level: "bad", text: "Max Loss limit reached. The challenge is breached." });
  else if (dlRoom <= 0) alerts.push({ level: "bad", text: "FTMO Daily Loss limit reached. Close everything and stop." });
  else if (ownRoom <= 0) alerts.push({ level: "bad", text: "You hit your own daily loss cap. Stop trading for today." });
  else if (usedOwn >= 0.5) alerts.push({ level: "warn", text: "You have used " + Math.round(usedOwn * 100) + "% of today's loss cap. Halve your size or stop." });
  if (streak >= S.stopAfterLosses) alerts.push({ level: "bad", text: streak + " losses in a row. Take a 30 minute break or end the day." });
  if (tt.length >= S.maxTrades) alerts.push({ level: "warn", text: "You reached " + tt.length + " trades today (limit " + S.maxTrades + "). Overtrading risk." });
  if (pnl + floating >= goalDay && goalDay > 0) alerts.push({ level: "good", text: "Daily target reached (" + usd(goalDay) + "). Protect it and consider stopping." });
  if (off > 0) alerts.push({ level: "warn", text: off + " trade" + (off > 1 ? "s" : "") + " today were outside your plan." });
  if (mlRoom > 0 && mlRoom / mlLimit < 0.35) alerts.push({ level: "warn", text: "Only " + usd(mlRoom) + " left before Max Loss. Reduce risk per trade." });
  if (stats.total >= B * S.phase / 100 && stats.tradingDays < S.minDays) alerts.push({ level: "info", text: "Target reached, but you need " + (S.minDays - stats.tradingDays) + " more trading day(s)." });
  if (!alerts.length) alerts.push({ level: "good", text: "All clear. You are inside every limit." });

}

function EquityChart({ stats, S, height = 280 }) {
  const W = 800, H = height, L = 64, R = 16, T = 16, B = 30;
  const pts = [{ label: tx("Start"), v: S.initial }]; let bal = S.initial;
  stats.days.forEach((d) => { bal += stats.dm[d].pnl; pts.push({ label: d.slice(5), v: bal }); });
  const floor = S.initial * (1 - S.mlPct / 100), goal = S.initial * (1 + S.phase / 100);
  const all = pts.map((p) => p.v).concat([floor, goal, S.initial]);
  const lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), pd = (hi - lo) * 0.06 || 50, y0 = lo - pd, y1 = hi + pd;
  const X = (i) => L + (pts.length === 1 ? 0 : (i / (pts.length - 1)) * (W - L - R));
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const line = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const area = line + " L" + X(pts.length - 1).toFixed(1) + " " + Y(y0).toFixed(1) + " L" + X(0).toFixed(1) + " " + Y(y0).toFixed(1) + " Z";
  const ticks = [0, 1, 2, 3, 4].map((i) => y0 + ((y1 - y0) * i) / 4);
  const ref = [{ v: goal, c: UP, t: tx("Target") }, { v: S.initial, c: MUTED, t: tx("Start") }, { v: floor, c: DOWN, t: "Max Loss" }];
  const step = Math.max(1, Math.ceil(pts.length / 8)), last = pts[pts.length - 1];
  return (
    <Box sx={{ overflowX: "auto" }}>
      <svg viewBox={"0 0 " + W + " " + H} role="img" aria-label="Equity curve" style={{ width: "100%", minWidth: 480, display: "block" }}>
        {ticks.map((v, i) => <g key={i}><line x1={L} x2={W - R} y1={Y(v)} y2={Y(v)} stroke={LINE} /><text x={L - 8} y={Y(v) + 4} textAnchor="end" fontSize="11" fill={MUTED} fontFamily={MONO}>{Math.round(v).toLocaleString("en-US")}</text></g>)}
        {ref.map((r) => <g key={r.t}><line x1={L} x2={W - R} y1={Y(r.v)} y2={Y(r.v)} stroke={r.c} strokeDasharray="4 4" opacity=".7" /><text x={W - R - 4} y={Y(r.v) - 5} textAnchor="end" fontSize="10" fill={r.c} fontFamily={MONO}>{r.t}</text></g>)}
        <path d={area} fill={ACCH} opacity=".05" /><path d={line} fill="none" stroke={ACC} strokeWidth="1.75" strokeLinejoin="round" />
        {pts.map((p, i) => <circle key={i} cx={X(i)} cy={Y(p.v)} r="2.5" fill={ACCFG} stroke={ACC} strokeWidth="1.25" />)}
        <circle cx={X(pts.length - 1)} cy={Y(last.v)} r="4.5" fill={ACC} />
        {pts.map((p, i) => (i % step === 0 || i === pts.length - 1) ? <text key={"x" + i} x={X(i)} y={H - 9} textAnchor="middle" fontSize="10.5" fill={MUTED} fontFamily={MONO}>{p.label}</text> : null)}
      </svg>
    </Box>
  );
}

function Md({ text }) {
  const lines = text.split("\n");

      })}

  );
}

      <DialogActions sx={{ px: 3, py: 1.5 }}><Button onClick={onClose} color="inherit">Close</Button></DialogActions>
    </Dialog>
  );
}

          inputProps={{ step: "any", inputMode: "decimal", style: { fontFamily: MONO, width: 90 } }} InputProps={{ startAdornment: <InputAdornment position="start">$</InputAdornment> }} />}>

  const cells = []; for (let i = 0; i < lead; i++) cells.push(null); for (let d = 1; d <= dim; d++) cells.push(d); while (cells.length % 7) cells.push(null);
  const weeks = []; for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  const ownLimit = S.initial * S.ownPct / 100, prefix = y + "-" + pad(m + 1) + "-";

            {sum("Month P/L", usd(mPnl, true), tone(mPnl))}{sum("Trade count", mN)}{sum("Win rate", (mN ? Math.round(mW / mN * 100) : 0) + "%")}
            {sum("Green / red days", mG + " / " + mR)}

        </Stack>

      <Panel sx={{ p: { xs: 1.25, sm: 2.25 } }}>

                  </Box>

        </Box>
        <Typography sx={{ fontSize: 12, color: "text.secondary", mt: 1.5 }}>{"Click a day to view or add trades. A red outline with ! means the day hit your own loss cap (" + usd(ownLimit) + "). ✎ marks a day with a journal note."}</Typography>
      </Panel>
    </Stack>
  );

function CalculatorPage({ S, info, openDay, todayStr }) {
  const [f, setF] = useState({ entry: "4000.00", sl: "3997.00", risk: String(S.riskPct), rr: "1.5", spread: "0.30" });
  const [checks, setChecks] = useState(CHECKLIST.map(() => false));
  const set = (k) => (e) => setF((o) => Object.assign({}, o, { [k]: e.target.value }));
  const n = (k) => parseFloat(f[k]);
  const entry = n("entry"), sl = n("sl"), rp = n("risk"), rr = n("rr"), spread = isFinite(n("spread")) ? n("spread") : 0, cs = S.contract;
  const ok = [entry, sl, rp, rr].every(isFinite) && entry !== sl;
  const dist = ok ? Math.abs(entry - sl) : 0, eff = dist + Math.max(spread, 0), riskT = S.initial * (rp || 0) / 100;
  const lots = ok ? Math.floor(riskT / (eff * cs) * 100 + 1e-9) / 100 : 0, real = lots * eff * cs, buy = sl < entry;
  const tp = buy ? entry + rr * dist : entry - rr * dist, reward = lots * rr * dist * cs;
  const warns = [];
  if (ok && lots < 0.01) warns.push({ level: "bad", text: "Lot size is below 0.01 at this risk. The stop is too wide. Tighten it or skip." });
  if (ok && real > info.ownRoom) warns.push({ level: "bad", text: "A full stop-out would breach your daily cap (" + usd(Math.max(info.ownRoom, 0)) + " left). Reduce size or stop for today." });
  if (ok && real > info.dlRoom) warns.push({ level: "bad", text: "A full stop-out would breach FTMO daily loss. Do not take this trade." });
  if (ok && real > info.mlRoom) warns.push({ level: "bad", text: "A full stop-out would breach FTMO max loss. Do not take this trade." });
  if (ok && rp > 1) warns.push({ level: "warn", text: "Risk above 1% per trade is aggressive for a challenge account." });
  if (ok && rr < 1) warns.push({ level: "warn", text: "Reward-to-risk below 1 needs a very high win rate." });
  if (ok && spread > 0 && spread / dist > 0.15) warns.push({ level: "warn", text: "Spread is over 15% of your stop distance. Consider skipping." });
  if (ok && real > 0 && !warns.some((w) => w.level === "bad")) warns.push({ level: "good", text: "You can lose about " + Math.floor((info.ownRoom) / real) + " full stops before your daily cap." });
  const ready = checks.every(Boolean) && ok && !warns.some((w) => w.level === "bad") && lots >= 0.01;
  const kv = (k, v, c) => <KV k={k} v={v} c={c} />;
  return (
    <Box sx={{ display: "grid", gridTemplateColumns: { xs: "1fr", lg: "1fr 1fr" }, gap: 2.5, alignItems: "start" }}>
      <Stack spacing={2.5}>
        <Panel title="Trade setup (XAUUSD)">
          <Box sx={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 2 }}>
            {[["c-entry", "Entry price", "entry"], ["c-sl", "Stop loss price", "sl"], ["c-risk", "Risk per trade (%)", "risk"], ["c-rr", "Target R : R", "rr"], ["c-spread", "Spread ($ per oz)", "spread"]].map((x) =>
              <TextField key={x[0]} id={x[0]} label={x[1]} size="small" value={f[x[2]]} onChange={set(x[2])} InputLabelProps={{ shrink: true }} {...numField} inputProps={Object.assign({}, numField.inputProps, { style: { fontFamily: MONO } })} />)}
          </Box>
          <Stack direction="row" spacing={1} sx={{ mt: 1.5 }}>{[0.25, 0.3, 0.5].map((v) => <Chip key={v} label={v + "%"} size="small" variant="outlined" onClick={() => setF((o) => Object.assign({}, o, { risk: String(v) }))} sx={{ fontFamily: MONO }} />)}</Stack>

async function streamChat(messages, onDelta, onThinking, signal) {
  const headers = { "Content-Type": "application/json" };
  try { if (sb) { const ses = await sb.auth.getSession(); if (ses.data.session) headers.Authorization = "Bearer " + ses.data.session.access_token; } } catch (e) {}
  const r = await fetch("/api/chat", { method: "POST", headers, body: JSON.stringify({ messages }), signal });
  if (r.status === 401) throw new Error("Sign in under Settings → Cloud sync to use the AI coach.");
  if (!r.ok) { let t = ""; try { t = await r.text(); } catch (e) {} throw new Error("Request failed (" + r.status + "). " + t.slice(0, 160)); }
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim(); if (d === "[DONE]") return;
      try { const j = JSON.parse(d); const dl = (j.choices && j.choices[0] && j.choices[0].delta) || {};
        if (dl.content) onDelta(dl.content); else if (dl.reasoning || dl.reasoning_content) onThinking(); } catch (e) {}
    }
  }
}

      rev.current = 1; ready.current = true; syncedKey.current = JSON.stringify(latest.current); writeMeta({ uid, rev: 1, dirty: false }); setStatus("synced"); return;

  const signIn = async (email) => {
    if (!sb) return; setMsg("");
    const r = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (r.error) { setStatus("error"); setMsg(r.error.message); return false; }
    setMsg("Sign-in link sent to " + email + ". Open it on this device."); return true;
  };
  const signOut = async () => { if (sb) await sb.auth.signOut(); writeMeta({}); };
  const resolve = (choice) => {
    const c = conflict; setConflict(null); if (!c) return;
    if (choice === "cloud") take(c.remote);
    else { rev.current = c.remote.rev; ready.current = true; push(); }
  };
  return { available: !!sb, user, status, msg, conflict, signIn, signOut, refresh: link, resolve };
}

/* ============ app shell ============ */
const NAV = [
  ["dashboard", "Dashboard", "dashboard"], ["calendar", "Calendar", "calendar"], ["trades", "Trades", "list"], ["analytics", "Analytics", "chart"],
  ["calculator", "Risk calculator", "calc"], ["coach", "AI coach", "spark"], ["settings", "Settings", "gear"],
];
const TITLES = { dashboard: "Dashboard", calendar: "Calendar", trades: "Trades", analytics: "Analytics", calculator: "Risk calculator", coach: "AI coach", settings: "Settings" };

function SidebarBody({ page, go, collapsed, setCollapsed, balance, S, stats, info, mobile }) {
  const c = collapsed && !mobile;
  const goalPct = Math.min(100, Math.max(0, stats.total / (S.initial * S.phase / 100) * 100));
  return (
    <Box sx={{ height: "100%", display: "flex", flexDirection: "column", bgcolor: SIDE, borderRight: "1px solid " + LINE, width: mobile ? 264 : c ? 76 : 248, transition: "width .18s", overflow: "hidden" }}>
      <Stack direction="row" alignItems="center" spacing={1.5} sx={{ p: c ? "18px 0" : "18px 20px", justifyContent: c ? "center" : "flex-start" }}>
        <Box sx={{ width: 32, height: 32, borderRadius: 1.5, bgcolor: ACC, color: ACCFG, display: "grid", placeItems: "center", fontWeight: 700, fontFamily: MONO, fontSize: 14, flexShrink: 0 }}>CJ</Box>
        {!c && <Box><Typography sx={{ fontWeight: 600, fontSize: 15, letterSpacing: "-.01em", lineHeight: 1.2 }}>Challenge Journal</Typography><Typography sx={{ fontSize: 11.5, color: "text.secondary" }}>XAUUSD · 2-Step</Typography></Box>}
      </Stack>
      <Box component="nav" aria-label="Main" sx={{ flex: 1, px: c ? 1 : 1.5, py: 1, overflowY: "auto" }}>
        {NAV.map((n) => {
          const active = page === n[0];
          const btn = (
            <Box component="button" key={n[0]} onClick={() => go(n[0])} aria-current={active ? "page" : undefined}
              sx={{ all: "unset", boxSizing: "border-box", display: "flex", alignItems: "center", gap: 1.5, width: "100%", p: c ? "11px 0" : "10px 12px", justifyContent: c ? "center" : "flex-start", cursor: "pointer", borderRadius: 1.5, mb: 0.5,
                color: active ? ACCH : SUBTLE, bgcolor: active ? NAVACT : "transparent", position: "relative", fontSize: 14, fontWeight: active ? 600 : 500, fontFamily: "inherit",
                "&:hover": { bgcolor: HOVER, color: ACCH }, "&:focus-visible": { outline: "2px solid " + ACC },
                "&::before": active ? { content: '""', position: "absolute", left: c ? 2 : -6, top: 10, bottom: 10, width: 3, borderRadius: 2, bgcolor: ACCH } : {} }}>
              <Icon name={n[2]} />{!c && <span>{tx(n[1])}</span>}
            </Box>);
          return c ? <Tooltip key={n[0]} title={tx(n[1])} placement="right">{btn}</Tooltip> : btn;
        })}
      </Box>
      {!c ? (
        <Box sx={{ m: 1.5, p: 1.75, border: "1px solid " + LINE, borderRadius: 2, bgcolor: PANEL }}>
          <Stack direction="row" justifyContent="space-between" alignItems="center"><Label>Account</Label><StatusChip status={info.status} /></Stack>
          <Typography sx={{ fontFamily: MONO, fontSize: 19, mt: 1, fontWeight: 500 }}>{usd(balance)}</Typography>
          <LinearProgress variant="determinate" value={goalPct} sx={{ height: 4, borderRadius: 2, bgcolor: TRACK, mt: 1.25, "& .MuiLinearProgress-bar": { bgcolor: goalPct >= 100 ? UP : ACC } }} />
          <Typography sx={{ fontSize: 11.5, color: "text.secondary", mt: 0.75 }}>{goalPct.toFixed(0) + "% of " + S.phase + "% target"}</Typography>
        </Box>
      ) : <Box sx={{ display: "grid", placeItems: "center", py: 1.5 }}><Tooltip title={"Status: " + info.status} placement="right"><Box sx={{ width: 10, height: 10, borderRadius: "50%", bgcolor: { clear: UP, caution: WARN, stop: DOWN }[info.status] }} /></Tooltip></Box>}
      {!mobile && (
        <Box sx={{ p: 1.5, borderTop: "1px solid " + LINE }}>
          <Button fullWidth color="inherit" onClick={() => setCollapsed(!collapsed)} aria-label={collapsed ? "Expand sidebar" : "Collapse sidebar"} sx={{ justifyContent: c ? "center" : "flex-start", color: "text.secondary", gap: 1.5, minWidth: 0 }}>
            <Icon name={c ? "right" : "left"} size={18} />{!c && "Collapse"}
          </Button>
        </Box>)}
    </Box>
  );
}

function App() {
  const init = useMemo(loadState, []);
  const [S, setS] = useState(Object.assign({}, defaultSettings, init.settings));
  const [trades, setTrades] = useState(init.trades);
  const [notes, setNotes] = useState(init.notes || {});
  const [floating, setFloating] = useState(init.floating || 0);
  const [sample, setSample] = useState(!!init.sample);
  const [chat, setChat] = useState(init.chat || []);
  const [page, setPage] = useState(() => { const h = (location.hash || "").slice(1); return TITLES[h] ? h : "dashboard"; });
  const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem("cj-collapsed") === "1"; } catch (e) { return false; } });
  const [drawer, setDrawer] = useState(false);
  const [dlg, setDlg] = useState(null);
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("cj-lang") === "th" ? "th" : "en"; } catch (e) { return "en"; } });
  const [mode, setMode] = useState(() => { try { return localStorage.getItem("cj-mode") === "light" ? "light" : "dark"; } catch (e) { return "dark"; } });
  LANG = lang; applyPalette(mode);
  const theme = useMemo(() => makeTheme(mode), [mode]);
  const [snack, setSnack] = useState("");
  const [health, setHealth] = useState(null);
  const desktop = useMediaQuery("(min-width:900px)");
  const todayStr = ymd(new Date());

  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify({ settings: S, trades, notes, floating, sample, chat: chat.slice(-40) })); } catch (e) {} }, [S, trades, notes, floating, sample, chat]);
  useEffect(() => {
    try { localStorage.setItem("cj-lang", lang); localStorage.setItem("cj-mode", mode); } catch (e) {}
    const r = document.documentElement; r.lang = lang; r.style.colorScheme = mode; r.style.setProperty("--sb", LINE2); r.style.setProperty("--bg", BG);
  }, [lang, mode]);
  useEffect(() => { try { localStorage.setItem("cj-collapsed", collapsed ? "1" : "0"); } catch (e) {} }, [collapsed]);
  useEffect(() => { fetch("/api/health").then((r) => r.json()).then(setHealth).catch(() => setHealth({ configured: false, model: "-", base: "-" })); }, []);
  useEffect(() => { const h = () => { const x = (location.hash || "").slice(1); if (TITLES[x]) setPage(x); }; window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);
  useEffect(() => { document.title = tx(TITLES[page]) + " · Challenge Journal"; }, [page]);

  const stats = useMemo(() => computeStats(trades, S), [trades, S]);
  const info = useMemo(() => todayInfo(stats, S, floating, todayStr), [stats, S, floating, todayStr]);
  const payload = useMemo(() => ({ settings: S, trades, notes }), [S, trades, notes]);
  const sync = useCloudSync(payload, () => sample || trades.length === 0, (d) => { setS(Object.assign({}, defaultSettings, d.settings || {})); setTrades(d.trades || []); setNotes(d.notes || {}); setSample(false); });
  const balance = S.initial + stats.total;
  const go = (p) => { setPage(p); setDrawer(false); try { history.replaceState(null, "", "#" + p); } catch (e) {} window.scrollTo(0, 0); };
  const toast = (m) => setSnack(tx(m));
  const mark = () => setSample(false);
  const setTradesE = (fn) => { mark(); setTrades(fn); };
  const setNotesE = (fn) => { mark(); setNotes(fn); };
  const openDay = (date, prefill) => setDlg({ date: date || todayStr, prefill: prefill || null });
  const replaceAll = (d) => { setS(d.settings); setTrades(d.trades); setNotes(d.notes); setSample(false); };
  const [confirmCfg, setConfirmCfg] = useState(null);
  const askConfirm = (cfg) => setConfirmCfg(cfg);
  const clearNow = () => { setTrades([]); setNotes({}); setSample(false); toast("All trades cleared"); };
  const clearAll = () => (sample
    ? askConfirm({ title: "Clear sample data?", note: "This removes the example trades. Your own data is not affected.", confirmLabel: "Clear", onConfirm: clearNow })
    : askConfirm({ title: "Clear all trades?", body: trades.length + " trades and all daily notes will be deleted.", note: "This cannot be undone. If cloud sync is on, the deletion syncs to your cloud copy too.", confirmLabel: "Clear", onConfirm: clearNow }));
  const loadNow = () => { const d = seedData(); setTrades(d.trades); setNotes({}); setSample(true); toast("Sample data loaded"); };
  const loadSample = () => (!sample && trades.length > 0
    ? askConfirm({ title: "Replace your trades with sample data?", body: trades.length + " of your trades will be replaced.", note: "Your current trades and notes will be overwritten. Export a backup first if you are unsure.", confirmLabel: "Replace", onConfirm: loadNow })
    : loadNow());

  const body = { balance, S, stats, info, collapsed, setCollapsed, page, go };
  const W = desktop ? (collapsed ? 76 : 248) : 0;

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      {desktop ? <Box sx={{ position: "fixed", inset: "0 auto 0 0", zIndex: 20 }}><SidebarBody {...body} /></Box>
        : <Drawer open={drawer} onClose={() => setDrawer(false)} PaperProps={{ sx: { bgcolor: SIDE, backgroundImage: "none" } }}><SidebarBody {...body} mobile /></Drawer>}
      <Box sx={{ ml: W + "px", transition: "margin .18s", minHeight: "100vh" }}>
        <Box component="header" sx={{ position: "sticky", top: 0, zIndex: 10, bgcolor: HDR, backdropFilter: "blur(10px)", borderBottom: "1px solid " + LINE,
          pl: "max(16px, env(safe-area-inset-left, 0px))", pr: "max(16px, env(safe-area-inset-right, 0px))", py: 1.5 }}>
          <Stack direction="row" alignItems="center" justifyContent="space-between" spacing={2} sx={{ maxWidth: 1180, mx: "auto" }}>
            <Stack direction="row" alignItems="center" spacing={1.5} sx={{ minWidth: 0 }}>
              {!desktop && <IconButton aria-label="Open menu" onClick={() => setDrawer(true)} sx={{ border: "1px solid " + LINE }}><Icon name="menu" /></IconButton>}
              <Box sx={{ minWidth: 0 }}>
                <Typography component="h1" sx={{ fontSize: { xs: 18, sm: 21 }, fontWeight: 600, letterSpacing: "-.02em", lineHeight: 1.2 }}>{tx(TITLES[page])}</Typography>
                <Typography sx={{ fontSize: 12, color: "text.secondary", display: { xs: "none", sm: "block" } }}>{prettyDate(todayStr)}</Typography>
              </Box>
            </Stack>
            <Stack direction="row" spacing={{ xs: 0.75, sm: 1.5 }} alignItems="center">
              {desktop && <StatusChip status={info.status} />}
              {sync.available && (
                <Tooltip title={tx("Cloud sync") + ": " + tx({ signedout: "Signed out", syncing: "Syncing…", synced: "Synced", error: "Sync error", paused: "Sync paused" }[sync.status])}>
                  <IconButton aria-label="Cloud sync" onClick={() => go("settings")} sx={{ border: "1px solid " + LINE, borderRadius: 1.5, width: 40, height: 40, color: { synced: UP, error: DOWN, paused: WARN }[sync.status] || MUTED }}>
                    <Icon name="cloud" size={18} />
                  </IconButton>
                </Tooltip>)}
              <Tooltip title={lang === "en" ? "ภาษาไทย" : "English"}>
                <IconButton aria-label={lang === "en" ? "Switch to Thai" : "Switch to English"} onClick={() => setLang(lang === "en" ? "th" : "en")}
                  sx={{ border: "1px solid " + LINE, borderRadius: 1.5, height: 40, px: 1.25, gap: 0.6, color: "text.primary" }}>
                  <Icon name="globe" size={18} /><Box component="span" sx={{ fontSize: 11.5, fontWeight: 700, fontFamily: MONO }}>{lang === "en" ? "EN" : "TH"}</Box>
                </IconButton>
              </Tooltip>
              <Tooltip title={mode === "dark" ? (lang === "th" ? "โหมดสว่าง" : "Light mode") : (lang === "th" ? "โหมดมืด" : "Dark mode")}>
                <IconButton aria-label={mode === "dark" ? "Switch to light mode" : "Switch to dark mode"} onClick={() => setMode(mode === "dark" ? "light" : "dark")}
                  sx={{ border: "1px solid " + LINE, borderRadius: 1.5, width: 40, height: 40, color: "text.primary" }}>
                  <Icon name={mode === "dark" ? "sun" : "moon"} size={18} />
                </IconButton>
              </Tooltip>
              <Button variant="contained" aria-label={tx("Add trade")} onClick={() => openDay(todayStr)}
                sx={{ bgcolor: ACC, color: ACCFG, fontWeight: 600, height: 40, minWidth: 40, px: { xs: 1, sm: 2 }, "&:hover": { bgcolor: ACCH } }}>
                <Icon name="plus" size={18} /><Box component="span" sx={{ display: { xs: "none", sm: "inline" }, ml: 1 }}>{tx("Add trade")}</Box>
              </Button>
            </Stack>
          </Stack>
        </Box>
        <Box sx={{ pl: "max(16px, env(safe-area-inset-left, 0px))", pr: "max(16px, env(safe-area-inset-right, 0px))", py: { xs: 2.5, sm: 3.5 } }}>
          <Box sx={{ maxWidth: 1180, mx: "auto" }}>
            {sample && page !== "settings" && (
              <Box sx={{ border: "1px solid " + LINE, borderLeft: "3px solid " + WARN, p: 1.5, mb: 2.5, borderRadius: 1.5, display: "flex", gap: 2, alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", bgcolor: PANEL }}>
                <Typography sx={{ fontSize: 13.5 }}>You are viewing sample data, not your trades. Clear it before you start logging.</Typography>
                <Button size="small" onClick={clearAll} sx={{ color: WARN }}>Clear sample data</Button>
              </Box>)}
            {page === "dashboard" && <Dashboard S={S} stats={stats} info={info} balance={balance} floating={floating} setFloating={setFloating} openDay={openDay} go={go} todayStr={todayStr} />}
            {page === "calendar" && <CalendarPage stats={stats} S={S} notes={notes} openDay={openDay} />}
            {page === "trades" && <TradesPage S={S} stats={stats} openDay={openDay} />}
            {page === "analytics" && <AnalyticsPage S={S} stats={stats} />}
            {page === "calculator" && <CalculatorPage S={S} info={info} openDay={openDay} todayStr={todayStr} />}
            {page === "coach" && <CoachPage S={S} stats={stats} info={info} notes={notes} chat={chat} setChat={setChat} health={health} askConfirm={askConfirm} />}
            {page === "settings" && <SettingsPage S={S} setS={setS} state={{ settings: S, trades, notes, sample }} replaceAll={replaceAll} clearAll={clearAll} loadSample={loadSample} health={health} toast={toast} sync={sync} sample={sample} askConfirm={askConfirm} />}
            <Typography sx={{ fontSize: 12, color: "text.secondary", mt: 5, maxWidth: 720 }}>General journaling and risk tool. Not investment advice, and it does not guarantee you will pass.</Typography>
          </Box>
        </Box>
      </Box>
      <TradeDialog ctx={dlg} onClose={() => setDlg(null)} trades={trades} notes={notes} setTrades={setTradesE} setNotes={setNotesE} S={S} toast={toast} askConfirm={askConfirm} />
      <Dialog open={!!confirmCfg} onClose={() => setConfirmCfg(null)} fullWidth maxWidth="xs" PaperProps={{ sx: { border: "1px solid " + LINE } }}>
        <DialogTitle sx={{ fontWeight: 600 }}>{confirmCfg ? tx(confirmCfg.title) : ""}</DialogTitle>
        <DialogContent>
          {confirmCfg && confirmCfg.body && <Typography sx={{ fontFamily: MONO, fontSize: 13, mb: 1.5, overflowWrap: "anywhere" }}>{confirmCfg.body}</Typography>}
          {confirmCfg && confirmCfg.note && <Typography sx={{ fontSize: 14, color: "text.secondary", lineHeight: 1.6 }}>{confirmCfg.note}</Typography>}
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}>
          <Button color="inherit" autoFocus onClick={() => setConfirmCfg(null)}>Cancel</Button>
          <Button variant="contained" onClick={() => { const c = confirmCfg; setConfirmCfg(null); if (c && c.onConfirm) c.onConfirm(); }} sx={{ bgcolor: DOWN, color: "#fff", fontWeight: 600, "&:hover": { bgcolor: DOWN, filter: "brightness(1.1)" } }}>{confirmCfg ? confirmCfg.confirmLabel : ""}</Button>
        </DialogActions>
      </Dialog>
      <Dialog open={!!sync.conflict} fullWidth maxWidth="xs" PaperProps={{ sx: { border: "1px solid " + LINE } }}>
        <DialogTitle sx={{ fontWeight: 600 }}>{tx("Cloud and this device are different")}</DialogTitle>
        <DialogContent>
          <Typography sx={{ fontSize: 14, color: "text.secondary", lineHeight: 1.6 }}>Your cloud journal and this device both have data. Pick which one to keep. The other one is overwritten.</Typography>
          {sync.conflict && <Typography sx={{ fontFamily: MONO, fontSize: 13, mt: 1.5 }}>{"Cloud has " + ((sync.conflict.remote.data.trades || []).length) + " trades, this device has " + trades.length + "."}</Typography>}
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2, flexWrap: "wrap", gap: 1 }}>
          <Button color="inherit" onClick={() => sync.resolve("device")}>Keep this device's data</Button>
          <Button variant="contained" onClick={() => sync.resolve("cloud")} sx={{ bgcolor: ACC, color: ACCFG, fontWeight: 600, "&:hover": { bgcolor: ACCH } }}>Keep cloud data</Button>
        </DialogActions>
      </Dialog>
      <Snackbar open={!!snack} autoHideDuration={2600} onClose={() => setSnack("")} message={snack} anchorOrigin={{ vertical: "bottom", horizontal: "center" }} />
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
